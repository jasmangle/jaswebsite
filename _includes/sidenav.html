{% assign cleanPageUrl = page.url | regex_replace_once: 'index\.html', '' %}
<div class="link-wrapper no-header">
  <ul class="link">
    {%- for section in site.sidebar_links -%}
    <li {% if cleanPageUrl == section.link | relative_url %}class="active"{% endif %}><a href="{{ section.link | relative_url }}">{{ section.icon }}&nbsp;{{ section.name }}</a></li>
    {%- endfor -%}
  </ul>
</div>
<div class="link-wrapper" header="Socials">
  <ul class="link">
    {%- for platform in site.sidebar -%}
    <li><a href="{{ platform.link }}">{{ platform.icon }}&nbsp;{{ platform.name }}</a></li>
    {%- endfor -%}
  </ul>
</div>
